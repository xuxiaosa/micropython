name: Build ESP32-C3 MicroPython
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false          # 关键改动1：不递归拉全部子模块，绕开损坏的 axtls
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch upstream MicroPython tags
        run: |
          git remote add upstream https://github.com/micropython/micropython.git
          git fetch upstream --tags
      # 关键改动2：在安装 ESP-IDF 之前，用系统 gcc 先把 mpy-cross 编好
      # 此时 PATH 干净，不会被 RISC-V 交叉工具链污染
      - name: Build mpy-cross (host tool)
        run: |
          make -C mpy-cross CC=gcc CXX=g++
      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.3"            # 建议与您 fork 的 lockfile 期望版本对齐（日志里显示为 5.5.5）
      - name: Build MicroPython
        run: |
          idf.py --version
          cd ports/esp32
          # 关键改动3：只拉本板需要的子模块，并显式指定 host 编译器
          make BOARD=ESP32_GENERIC_C3 submodules
          make BOARD=ESP32_GENERIC_C3 CC=gcc CXX=g++
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: |
            ports/esp32/build-ESP32_GENERIC_C3/firmware.bin
            ports/esp32/build-ESP32_GENERIC_C3/firmware.elf
