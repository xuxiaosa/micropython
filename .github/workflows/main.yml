name: Build ESP32-C3 MicroPython
on:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false          # 绕开损坏的 axtls 子模块
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch upstream MicroPython tags
        run: |
          git remote add upstream https://github.com/micropython/micropython.git
          git fetch upstream --tags
      - name: Build mpy-cross (host tool)
        run: |
          make -C mpy-cross -j2
      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.3"
      - name: Build MicroPython
        run: |
          # 关键修复：把系统目录提到 PATH 最前，
          # 保证 mpy-cross 编译时用系统的 gcc/as；
          # ESP-IDF 编译 ESP32 代码用绝对路径工具链，不受影响
          export PATH="/usr/bin:/bin:$PATH"
          idf.py --version
          cd ports/esp32
          make BOARD=ESP32_GENERIC_C3 submodules
          make BOARD=ESP32_GENERIC_C3
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: |
            ports/esp32/build-ESP32_GENERIC_C3/firmware.bin
            ports/esp32/build-ESP32_GENERIC_C3/firmware.elf
